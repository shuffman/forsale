<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Sale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<body>

  <header class="site-header">
    <div class="container">
      <h1 class="site-title">For Sale</h1>
      <p class="site-tagline">Curated items available for private sale</p>
    </div>
  </header>

  <main class="container">
    <div class="listings-grid">

      <a href="items/sports-car/" class="listing-card">
        <div class="card-image">
          <img src="items/sports-car/images/hero.jpg" alt="2019 Porsche 911 GT3">
          <span class="card-badge">$130,000</span>
        </div>
        <div class="card-body">
          <h2 class="card-title">2019 Porsche 911 GT3</h2>
          <p class="card-subtitle">4,200 miles &middot; Guards Red &middot; PDK</p>
          <p class="card-excerpt">One owner, dealer maintained, never tracked. Factory sport exhaust and PCCB. Exceptional condition throughout.</p>
        </div>
      </a>

      <!-- Copy the block above to add more listings -->

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>All items sold as-is. Serious inquiries only.</p>
    </div>
  </footer>

</body>
</html>
